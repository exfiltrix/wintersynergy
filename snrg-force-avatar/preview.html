<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNRG Force Avatars</title>
<style>
  :root { --fg:#111; --muted:#666; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; font:14px/1.4 system-ui, sans-serif; color:var(--fg); background:#f4f4f6; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.note { color:var(--muted); margin:0 0 20px; }
  .theme { border-radius:12px; padding:20px; margin-bottom:20px; overflow-x:auto; }
  .light { background:#ffffff; color:#111; }
  .dark  { background:#17212b; color:#f5f5f5; } /* Telegram dark default */
  .theme h2 { font-size:15px; margin:0 0 16px; }
  .row { display:flex; align-items:flex-end; gap:20px; margin-bottom:24px; }
  .row:last-child { margin-bottom:0; }
  .label { width:90px; flex:none; font-weight:600; }
  figure { margin:0; text-align:center; flex:none; }
  figcaption { font-size:11px; opacity:.6; margin-top:4px; }
  img.av { display:block; border-radius:50%; }
  .s512 { width:512px; height:512px; } .s160 { width:160px; height:160px; }
  .s80 { width:80px; height:80px; }   .s40 { width:40px; height:40px; }
  /* chat-list mock row */
  .chat { display:flex; gap:10px; align-items:center; padding:6px 8px; border-radius:8px; width:240px; }
  .chat b { display:block; font-size:13px; } .chat span { font-size:12px; opacity:.6; }
  .safe { position:relative; }
  .safe::after { content:""; position:absolute; inset:10%; border-radius:50%; outline:1px dashed rgba(255,0,80,.8); }
</style>
</head>
<body>
<h1>SNRG Force — превью аватарок</h1>
<p class="note">Круглая маска как в Telegram. Пунктир на 160 px — безопасная зона 80% диаметра.</p>
<div id="root"></div>
<script>
  const concepts = [['a','A — монограмма SF'],['b','B — импульс + SNRG'],['c','C — шеврон отряда']];
  const root = document.getElementById('root');
  for (const [theme, name] of [['light','Светлая тема'],['dark','Тёмная тема']]) {
    const sec = document.createElement('section');
    sec.className = 'theme ' + theme;
    sec.innerHTML = `<h2>${name}</h2>`;
    for (const [id, title] of concepts) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="label">${title}</div>` +
        [512,160,80,40].map(s => `<figure${s===160?' class="safe"':''}><img class="av s${s}" src="concept-${id}.svg" alt=""><figcaption>${s}px</figcaption></figure>`).join('') +
        `<div class="chat"><img class="av s40" src="concept-${id}.svg" alt=""><div><b>SNRG Force</b><span>Хакатон в субботу 🔥</span></div></div>`;
      sec.appendChild(row);
    }
    root.appendChild(sec);
  }
</script>
</body>
</html>
